<!doctype html><html><head><meta charset="utf-8"><title>Wake splash preview</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d1a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;color:#e8eaf2}
  .splash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 800px at 50% 45%,#161c34 0%,#0a0d1a 70%)}
  .stack{display:flex;flex-direction:column;align-items:center;gap:28px}
  .icon{width:128px;height:128px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
  .word{font-size:34px;font-weight:600;letter-spacing:.02em;margin-top:-6px}
  .tag{font-size:14px;color:#9aa1b8;letter-spacing:.14em;text-transform:uppercase;margin-top:-18px}
  .bar{width:280px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:26px}
  .bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#f4a742,#ffd27a);border-radius:2px;animation:grow 6s ease-in-out infinite}
  @keyframes grow{0%{width:8%}60%{width:70%}100%{width:96%}}
  .status{font-size:13px;color:#9aa1b8;height:18px;font-variant-numeric:tabular-nums}
  .keys{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#5c6380}
</style></head><body>
<div class="splash"><div class="stack">
  <img class="icon" src="icon.svg" alt="">
  <div class="word">Wake</div>
  <div class="tag">the map behind the agent</div>
  <div class="bar"><i></i></div>
  <div class="status" id="s">indexing 357 files</div>
</div></div>
<div class="keys">press any key to skip · the map opens where the agent is</div>
<script>
const steps=["reading repository","indexing 357 files","laying out 90 districts","routing 582 roads","loading session","tokenizing source"];let i=0;
setInterval(()=>{i=(i+1)%steps.length;document.getElementById('s').textContent=steps[i]},1000);
</script></body></html>
